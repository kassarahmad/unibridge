          enum:
          - pending
          - approved
          title: Status
        passages:
          type: integer
          title: Passages
        unchanged:
          type: boolean
          title: Unchanged
          description: True when the same version was already ingested.
          default: false
      type: object
      required:
      - document_id
      - document_version
      - status
      - passages
      title: IngestResult
