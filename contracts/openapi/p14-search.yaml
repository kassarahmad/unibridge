    IngestDocument:
      properties:
        source_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          title: Source Id
          description: Source/repository identifier.
        external_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
          title: External Id
          description: Id of the document in its source.
        title:
          type: string
          maxLength: 500
          minLength: 1
          title: Title
        file:
          $ref: '#/components/schemas/FileContent'
        metadata:
          $ref: '#/components/schemas/DocumentMetadata'
        access_level:
          $ref: '#/components/schemas/AccessLevel'
        owner:
          type: string
          maxLength: 200
          minLength: 1
          title: Owner
          description: Accountable owner (a role, not a person).
        source_piece:
          type: string
          pattern: ^P\d{2}$
          title: Source Piece
          description: Puzzle piece that produced the document.
          default: P14
        validated_by:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Validated By
          description: Expert validation (P25 knowledge cards).
        synthetic:
          type: boolean
          title: Synthetic
          default: false
        llm_generated:
          type: boolean
          title: Llm Generated
          default: false
      additionalProperties: false
      type: object
      required:
      - source_id
      - external_id
      - title
      - file
      - metadata
      - access_level
      - owner
      title: IngestDocument
      description: Inbound format shared by every producer (admin upload, P11, P15,
        P25).
    IngestResult:
      properties:
        document_id:
          type: string
          title: Document Id
        document_version:
          type: string
          title: Document Version
        status:
