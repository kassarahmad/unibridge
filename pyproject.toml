[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p14-search"
version = "0.1.0"
description = "P14 - Intelligent search across organizational knowledge (AI Puzzle, Complex Systems Design, UNICAM)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "qdrant-client>=1.19,<1.21",
    "sentence-transformers>=3.0",
    "torch>=2.7",
    "numpy>=1.26",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "pyyaml>=6.0",
    "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jsonschema>=4.22",
]
data = [
    "fpdf2>=2.7",
]
ui = [
    "streamlit>=1.38",
    "requests>=2.32",
]
# scripts/capture_evidence*.py: screenshots with the locally installed Microsoft Edge
evidence = [
    "playwright>=1.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p14_search = ["i18n_llm.json"]

[tool.uv]
# RTX 5070 (Blackwell, sm_120) needs a CUDA 12.8 build of PyTorch.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -p no:logging"
filterwarnings = ["ignore:Payload indexes have no effect:UserWarning"]
markers = [
    "integration: needs a running Qdrant and downloaded models",
]
