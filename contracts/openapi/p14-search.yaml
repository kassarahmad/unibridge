openapi: 3.1.0
info:
  title: P14 Knowledge Search API
  description: 'Search across organizational knowledge with verifiable citations (AI
    Puzzle piece P14). Errors use RFC 9457 problem+json. Authentication: X-API-Key
    header.'
  version: 0.1.0
paths:
  /v1/health:
    get:
      tags:
      - meta
      summary: Health
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/version:
    get:
      tags:
      - meta
      summary: Version
      operationId: version_v1_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Versions'
  /v1/search:
    post:
      tags:
      - search
      summary: Search
      operationId: search_v1_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request Entity Too Large
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/answer:
    post:
      tags:
      - answer
      summary: Answer
      description: 'Answer in the student''s language (it, en, ar); every sentence
        cites a passage, shown with its Italian original.

        Without a configured LLM the answer is extractive. Weak evidence -> ''I don''t
        know'' + a draft for the right office.'
      operationId: answer_v1_answer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request Entity Too Large
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/handoff:
    post:
      tags:
      - answer
      summary: Handoff
      description: Draft (never send) a formal Italian message to the office responsible
        for the question.
      operationId: handoff_v1_handoff_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request Entity Too Large
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/documents:
    post:
      tags:
      - documents
      summary: Ingest
      description: Ingest a document. It stays NOT searchable until an owner approves
        it (human oversight).
      operationId: ingest_v1_documents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestDocument'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '401':
          description: Unauthorized
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request Entity Too Large
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/documents/{document_id}/approve:
    post:
      tags:
      - documents
      summary: Approve
      description: 'Owner approval: indexes the current version and makes it searchable.'
      operationId: approve_v1_documents__document_id__approve_post
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '401':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '413':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request Entity Too Large
        '415':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported Media Type
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '503':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service Unavailable
  /v1/documents/{document_id}:
    get:
      tags:
      - documents
      summary: Get Document
      operationId: get_document_v1_documents__document_id__get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInfo'
        '401':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '413':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request Entity Too Large
        '415':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported Media Type
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '503':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service Unavailable
  /v1/passages/{passage_id}:
    get:
      tags:
      - documents
      summary: Get Passage
      description: Resolve a cited passage, also from superseded versions (active=false).
      operationId: get_passage_v1_passages__passage_id__get
      parameters:
      - name: passage_id
        in: path
        required: true
        schema:
          type: string
          title: Passage Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassageInfo'
        '401':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '413':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request Entity Too Large
        '415':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported Media Type
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '503':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service Unavailable
  /v1/feedback:
    post:
      tags:
      - feedback
      summary: Feedback
      description: Store the user's judgement on a returned passage (operator's final
        decision, for traceability).
      operationId: feedback_v1_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResult'
        '401':
          description: Unauthorized
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request Entity Too Large
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    AccessLevel:
      type: string
      enum:
      - public
      - internal
      - restricted
      title: AccessLevel
    AnswerRequest:
      properties:
        query:
          type: string
          maxLength: 1000
          minLength: 1
          title: Query
        language:
          anyOf:
          - type: string
            enum:
            - it
            - en
            - ar
          - type: 'null'
          title: Language
          description: Answer language; null = detected from the query (it, en, ar).
        mode:
          type: string
          enum:
          - auto
          - extractive
          - llm
          - llm_verified
          title: Mode
          description: auto = llm_verified when an LLM is configured, else extractive.
            'llm' skips the verifier (evaluation only).
          default: auto
        top_k:
          anyOf:
          - type: integer
            maximum: 20.0
            minimum: 1.0
          - type: 'null'
          title: Top K
          description: Passages given to the answer step; null = server default.
        with_handoff:
          type: boolean
          title: With Handoff
          description: Draft an e-mail to the responsible office when the answer is
            'I don't know'.
          default: true
      additionalProperties: false
      type: object
      required:
      - query
      title: AnswerRequest
    AnswerResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        query:
          type: string
          title: Query
        language:
          type: string
          enum:
          - it
          - en
          - ar
          title: Language
        mode:
          type: string
          enum:
          - llm_verified
          - llm
          - extractive
          - insufficient_evidence
          title: Mode
        answer_text:
          type: string
          title: Answer Text
          description: Sentences joined, without citation markers; empty for 'I don't
            know'.
        sentences:
          items:
            $ref: '#/components/schemas/AnswerSentence'
          type: array
          title: Sentences
        sources:
          items:
            $ref: '#/components/schemas/SourcePassage'
          type: array
          title: Sources
          description: Passages given to the answer step, in rank order, with citations.
        insufficient_evidence:
          type: boolean
          title: Insufficient Evidence
          description: True when the answer is 'I don't know'.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Note in the user's language ('I don't know', extractive note,
            fallback).
        handoff:
          anyOf:
          - $ref: '#/components/schemas/HandoffResponse'
          - type: 'null'
        verification:
          anyOf:
          - $ref: '#/components/schemas/VerificationReport'
          - type: 'null'
        llm:
          anyOf:
          - $ref: '#/components/schemas/LLMUsage'
          - type: 'null'
        retrieval_system:
          type: string
          title: Retrieval System
        query_italian:
          anyOf:
          - type: string
          - type: 'null'
          title: Query Italian
          description: LLM translation of the query used as a second retrieval query.
        latency_ms:
          type: number
          title: Latency Ms
        versions:
          $ref: '#/components/schemas/Versions'
      type: object
      required:
      - request_id
      - query
      - language
      - mode
      - answer_text
      - sentences
      - sources
      - insufficient_evidence
      - retrieval_system
      - latency_ms
      - versions
      title: AnswerResponse
    AnswerSentence:
      properties:
        text:
          type: string
          title: Text
        passage_ids:
          items:
            type: string
          type: array
          title: Passage Ids
          description: Passages cited by this sentence (empty = uncited, shown only
            in mode 'llm').
        supported:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Supported
          description: Result of the support check (null = not checked).
      type: object
      required:
      - text
      - passage_ids
      title: AnswerSentence
    ApproveRequest:
      properties:
        note:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Note
          description: Why the owner approves (stored in approval_log).
      type: object
      title: ApproveRequest
    Citation:
      properties:
        document_id:
          type: string
          title: Document Id
        document_version:
          type: string
          title: Document Version
        title:
          type: string
          title: Title
        section:
          anyOf:
          - type: string
          - type: 'null'
          title: Section
          description: Section heading, e.g. 'Art. 18'.
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
          description: 1-based page for paginated formats (PDF).
        char_start:
          type: integer
          title: Char Start
          description: Offset in the parsed document text.
        char_end:
          type: integer
          title: Char End
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
      type: object
      required:
      - document_id
      - document_version
      - title
      - char_start
      - char_end
      title: Citation
    DocumentInfo:
      properties:
        document_id:
          type: string
          title: Document Id
        source_id:
          type: string
          title: Source Id
        external_id:
          type: string
          title: External Id
        title:
          type: string
          title: Title
        access_level:
          $ref: '#/components/schemas/AccessLevel'
        metadata:
          $ref: '#/components/schemas/DocumentMetadata'
        owner:
          type: string
          title: Owner
        source_piece:
          type: string
          title: Source Piece
        validated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Validated By
        synthetic:
          type: boolean
          title: Synthetic
        llm_generated:
          type: boolean
          title: Llm Generated
        status:
          type: string
          enum:
          - pending
          - approved
          title: Status
        current_version:
          type: string
          title: Current Version
        versions:
          items:
            type: string
          type: array
          title: Versions
      type: object
      required:
      - document_id
      - source_id
      - external_id
      - title
      - access_level
      - metadata
      - owner
      - source_piece
      - validated_by
      - synthetic
      - llm_generated
      - status
      - current_version
      - versions
      title: DocumentInfo
    DocumentMetadata:
      properties:
        office:
          type: string
          maxLength: 40
          minLength: 1
          title: Office
          description: Owning office, e.g. hr, it, legal.
        type:
          type: string
          maxLength: 40
          minLength: 1
          title: Type
          description: Document type, e.g. legislation, procedure, faq.
        author:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Author
        date:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          title: Date
          description: ISO date (YYYY-MM-DD) of the document.
        project:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Project
        source_url:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Source Url
          description: Where the original was obtained.
      additionalProperties: false
      type: object
      required:
      - office
      - type
      title: DocumentMetadata
    Evidence:
      properties:
        score:
          type: number
          title: Score
          description: Score of the system that produced the ranking (RRF for hybrid).
        rank:
          type: integer
          minimum: 1.0
          title: Rank
        retriever_ranks:
          additionalProperties:
            anyOf:
            - type: integer
            - type: 'null'
          type: object
          title: Retriever Ranks
          description: Rank in each retriever (bm25, dense); null = not retrieved.
        retriever_scores:
          additionalProperties:
            anyOf:
            - type: number
            - type: 'null'
          type: object
          title: Retriever Scores
      type: object
      required:
      - score
      - rank
      - retriever_ranks
      - retriever_scores
      title: Evidence
      description: Ranking evidence. Scores are NOT calibrated probabilities and must
        not be read as confidence.
    FeedbackJudgement:
      type: string
      enum:
      - useful
      - not_useful
      - wrong_source
      title: FeedbackJudgement
    FeedbackRequest:
      properties:
        request_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Request Id
        passage_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Passage Id
        judgement:
          $ref: '#/components/schemas/FeedbackJudgement'
        comment:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Comment
      additionalProperties: false
      type: object
      required:
      - request_id
      - passage_id
      - judgement
      title: FeedbackRequest
    FeedbackResult:
      properties:
        feedback_id:
          type: integer
          title: Feedback Id
        stored:
          type: boolean
          title: Stored
          default: true
      type: object
      required:
      - feedback_id
      title: FeedbackResult
    FileContent:
      properties:
        filename:
          type: string
          maxLength: 255
          minLength: 1
          title: Filename
        media_type:
          type: string
          enum:
          - application/pdf
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - text/html
          - text/plain
          title: Media Type
        content_base64:
          type: string
          title: Content Base64
          description: File bytes, base64-encoded.
      additionalProperties: false
      type: object
      required:
      - filename
      - media_type
      - content_base64
      title: FileContent
    HandoffDraft:
      properties:
        office_id:
          type: string
          enum:
          - scholarship
          - student_office
          - international
          title: Office Id
        office_name:
          type: string
          title: Office Name
        channel:
          type: string
          enum:
          - email
          - srm_ticket
          - desk
          title: Channel
        to:
          anyOf:
          - type: string
          - type: 'null'
          title: To
          description: Recipient address, only when published in the corpus; null
            otherwise.
        how_to_send:
          type: string
          title: How To Send
          description: How the student can contact the office (from the official documents).
        contact_source:
          type: string
          title: Contact Source
          description: Document that publishes the contact channel.
        rule:
          type: string
          title: Rule
          description: Why this office was chosen (rule table config/handoff_offices.json).
        subject:
          type: string
          title: Subject
        body:
          type: string
          title: Body
          description: Formal Italian text. Placeholders [..] are for the student;
            nothing personal is filled in.
        question_original:
          type: string
          title: Question Original
        question_italian:
          anyOf:
          - type: string
          - type: 'null'
          title: Question Italian
          description: Italian translation of the question (LLM), null if not available.
        translated_by_llm:
          type: boolean
          title: Translated By Llm
        sources:
          items:
            $ref: '#/components/schemas/HandoffSource'
          type: array
          title: Sources
        sent:
          type: boolean
          title: Sent
          description: 'Always false: UniBridge never sends messages, the student
            does.'
          default: false
      type: object
      required:
      - office_id
      - office_name
      - channel
      - to
      - how_to_send
      - contact_source
      - rule
      - subject
      - body
      - question_original
      - question_italian
      - translated_by_llm
      - sources
      title: HandoffDraft
    HandoffRequest:
      properties:
